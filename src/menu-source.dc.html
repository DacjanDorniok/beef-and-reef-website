<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Lista menu Beef &amp; Reef</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="font-family: 'Cormorant Garamond', Cormorant, Garamond, 'Times New Roman', serif; color: var(--ink, #000000); width: 100%; display: flex; flex-direction: column; gap: 96px">
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div id="{{g.anchor}}" style="scroll-margin-top: 150px; display: flex; flex-direction: column; gap: 72px">
      <sc-if value="{{g.notFirst}}" hint-placeholder-val="{{ false }}">
        <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 6px; width: 120px; align-self: center">
          <div style="height: 1px; background: #d2ac5a"></div>
          <div style="height: 0.5px; background: #d2ac5a"></div>
        </div>
      </sc-if>
      <sc-if value="{{g.hasTitle}}" hint-placeholder-val="{{ false }}">
        <h2 style="margin: 0 0 -32px; align-self: center; font-size: 24px; line-height: 1.2; font-weight: 400; letter-spacing: 0.28em; text-transform: uppercase; text-align: center; padding: 0 0 10px 0.28em; border-bottom: 0.5px solid var(--rule, #000000)">{{g.title}}</h2>
      </sc-if>
      <div style="display: flex; flex-wrap: wrap; gap: 72px 96px; align-items: flex-start">
        <sc-for list="{{g.cols}}" as="col" hint-placeholder-count="2">
          <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 72px">
            <sc-for list="{{col.sections}}" as="s" hint-placeholder-count="1">
              <section id="{{s.id}}" style="scroll-margin-top: 150px; display: flex; flex-direction: column; align-items: center; gap: 32px">
                <sc-if value="{{s.hasTitle}}" hint-placeholder-val="{{ true }}">
                  <h2 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 400; letter-spacing: 0.28em; text-transform: uppercase; text-align: center; padding: 0 0 10px 0.28em; border-bottom: 0.5px solid var(--rule, #000000)">{{s.title}}</h2>
                </sc-if>

                <sc-if value="{{s.isDishes}}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 44px; width: 100%">
                    <sc-for list="{{s.items}}" as="it" hint-placeholder-count="3">
                      <article style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; max-width: 440px">
                        <h3 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700">{{it.name}}</h3>
                        <p style="margin: 2px 0 0; font-size: 17px; line-height: 1.35">{{it.desc}}</p>
                        <p style="margin: 10px 0 0; font-size: 17px; line-height: 1.3; font-weight: 700; font-variant-numeric: oldstyle-nums">{{it.price}}</p>
                      </article>
                    </sc-for>
                  </div>
                </sc-if>

                <sc-if value="{{s.isList}}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 520px">
                    <sc-for list="{{s.items}}" as="it" hint-placeholder-count="5">
                      <sc-if value="{{it.isSub}}" hint-placeholder-val="{{ false }}">
                        <h3 style="margin: 12px 0 2px; font-size: 17px; font-weight: 400; letter-spacing: 0.3em; text-align: center">{{it.name}}</h3>
                      </sc-if>
                      <sc-if value="{{it.isRow}}" hint-placeholder-val="{{ true }}">
                        <p style="margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 20px">
                          <span style="font-size: 20px; line-height: 1.35; flex: 1 1 auto; min-width: 0">{{it.name}}</span>
                          <span style="font-size: 20px; line-height: 1.35; white-space: nowrap; font-variant-numeric: oldstyle-nums">{{it.price}}</span>
                        </p>
                      </sc-if>
                    </sc-for>
                  </div>
                </sc-if>
              </section>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
  <p style="margin: 0; text-align: center; font-size: 12px; font-weight: 500; letter-spacing: 0.3em; color: var(--muted, #5e5e5e)">{{priceNote}}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["pl","en"],"default":"pl"},"$preview":{"width":1280,"height":8000}}'>
class Component extends DCLogic {

         dishes('dla-dzieci', ['Menu dla dzieci', 'Kids’ Menu'], [

        [dishes('sandwich', 'Sandwich', [
          D('Beef & Reef', ['Polędwica wołowa, krewetki, mix sałat, grzyby marynowane, majonez homarowy', 'Beef fillet, prawns, mixed leaves, pickled mushrooms, lobster mayonnaise'], '52'),
          D('Black Angus', ['Sezonowana wołowina rasy Black Angus, sos BBQ, ogórek konserwowy, prażona cebula, ser cheddar', 'Aged Black Angus beef, BBQ sauce, cheddar, pickled gherkin, crispy onions'], '49')
        ])]
      ]},
      { id: 'desserts', title: ['Desery', 'Desserts'], cols: [
        [dishes('desery', null, [
          D('Crème brûlée', ['Francuski deser opalany brązowym cukrem', 'Classic French custard with a caramelised brown sugar crust'], '37'),
          D(['Kremowy sernik', 'Creamy Cheesecake'], ['Lody waniliowe, mus malinowy, owoce', 'Vanilla ice cream, raspberry mousse, fruit'], '39')

        [dishes('desery-2', null, [

        ])]
      ]},

        [list('herbaty', ['Herbaty', 'Tea'], [
          L('Ceylon gold', '20'), L('Earl Grey', '20'), L('Black chili chocolate', '20'), L('Gunpowder green', '20'), L('Green jasmine', '20'), L('Forest fruits', '20'), L('Raspberry pear', '20'), L('Rooibos', '20')
        ]),
         list('lemoniady', ['Lemoniady', 'Lemonades'], [
          L(['Klasyczna (szklanka / karafka)', 'Classic (glass / carafe)'], '18 / 40'), L(['Smakowa (szklanka / karafka)', 'Flavoured (glass / carafe)'], '20 / 48')

          S(['Butelkowe', 'Bottled']),

          S(['Butelkowe 0%', 'Alcohol-free']),

}
</script>
</body>
</html>
